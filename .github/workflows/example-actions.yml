name: Example GitHub Actions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: 20
      - name: Verify runner
        run: node --version
      - name: Post URL to PR comments
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          message: |
            hello world

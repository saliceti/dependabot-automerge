name: Example GitHub Actions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: 20
      - name: Verify runner
        run: node --version
